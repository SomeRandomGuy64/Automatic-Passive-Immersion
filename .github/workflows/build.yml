name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            qt-arch: linux_gcc_64
            cmake-args: ""
          - os: windows-2022
            name: windows-x64
            qt-arch: win64_msvc2022_64
            cmake-args: ""
          - os: macos-14
            name: macos-universal
            qt-arch: clang_64
            cmake-args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.10.3"
        arch: ${{ matrix.qt-arch }}
        cache: true

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: >
        sudo apt-get update && sudo apt-get install -y
        libx11-dev libxkbcommon-dev libgl1-mesa-dev xvfb
        libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
        libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

    - name: Configure CMake
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

    - name: Build
      run: cmake --build build --config Release --parallel

    # Qt's deploy tool refuses a relative prefix
    - name: Make portable folder
      run: cmake --install build --config Release --prefix "${{ github.workspace }}/dist"

    # Archived by hand: upload-artifact's own zipping drops the symlinks and exec bits a .app needs
    - name: Archive (Linux)
      if: runner.os == 'Linux'
      run: tar -czf AutomaticPassiveImmersion-${{ matrix.name }}.tar.gz -C dist .

    - name: Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path dist/* -DestinationPath AutomaticPassiveImmersion-${{ matrix.name }}.zip

    - name: Archive (macOS)
      if: runner.os == 'macOS'
      run: ditto -c -k --keepParent dist/AutomaticPassiveImmersion.app AutomaticPassiveImmersion-${{ matrix.name }}.zip

    # Smoke tests run from a fresh copy of the archive, so they check exactly what gets downloaded.
    # --list-playing starts the app, runs the OS's media detector once and exits.
    - name: Smoke test (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir smoke && tar -xzf AutomaticPassiveImmersion-${{ matrix.name }}.tar.gz -C smoke
        xvfb-run -a ./smoke/bin/AutomaticPassiveImmersion --list-playing

    - name: Smoke test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      timeout-minutes: 2
      run: |
        Expand-Archive AutomaticPassiveImmersion-${{ matrix.name }}.zip -DestinationPath smoke
        if (-not (Test-Path smoke/vcruntime140.dll)) { Write-Error "MSVC runtime missing from the zip"; exit 1 }
        $app = Start-Process -FilePath smoke/AutomaticPassiveImmersion.exe -ArgumentList "--list-playing" -Wait -PassThru -NoNewWindow
        if ($app.ExitCode -ne 0) { Write-Error "App exited with $($app.ExitCode)"; exit 1 }

    - name: Smoke test (macOS)
      if: runner.os == 'macOS'
      run: |
        ditto -x -k AutomaticPassiveImmersion-${{ matrix.name }}.zip smoke
        ./smoke/AutomaticPassiveImmersion.app/Contents/MacOS/AutomaticPassiveImmersion --list-playing

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AutomaticPassiveImmersion-${{ matrix.name }}
        path: AutomaticPassiveImmersion-${{ matrix.name }}.*
