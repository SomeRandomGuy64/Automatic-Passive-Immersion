name: Build

on:
  push:
    branches: ["main"]
    # Pushing a vX.Y.Z tag builds, tests and publishes a GitHub release
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            qt-arch: linux_gcc_64
            cmake-args: ""
          - os: windows-2022
            name: windows-x64
            qt-arch: win64_msvc2022_64
            cmake-args: ""
          - os: macos-14
            name: macos-universal
            qt-arch: clang_64
            cmake-args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The app compares its own version with the latest release's tag, so a mismatch would offer the wrong update
    - name: Check the tag matches the version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        version=$(sed -nE 's/^ +VERSION ([0-9.]+)$/\1/p' CMakeLists.txt | head -1)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in CMakeLists.txt ($version)"
          exit 1
        fi

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.10.3"
        arch: ${{ matrix.qt-arch }}
        cache: true

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: >
        sudo apt-get update && sudo apt-get install -y
        libx11-dev libxkbcommon-dev libgl1-mesa-dev xvfb
        libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
        libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

    - name: Configure CMake
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

    - name: Build
      run: cmake --build build --config Release --parallel

    # Qt's deploy tool refuses a relative prefix
    - name: Make portable folder
      run: cmake --install build --config Release --prefix "${{ github.workspace }}/dist"

    # Archived by hand: upload-artifact's own zipping drops the symlinks and exec bits a .app needs
    - name: Archive (Linux)
      if: runner.os == 'Linux'
      run: tar -czf AutomaticPassiveImmersion-${{ matrix.name }}.tar.gz -C dist .

    - name: Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path dist/* -DestinationPath AutomaticPassiveImmersion-${{ matrix.name }}.zip

    - name: Archive (macOS)
      if: runner.os == 'macOS'
      run: ditto -c -k --keepParent dist/AutomaticPassiveImmersion.app AutomaticPassiveImmersion-${{ matrix.name }}.zip

    # Smoke tests run from a fresh copy of the archive, so they check exactly what gets downloaded.
    # The Qt install is hidden first: otherwise the app quietly loads Qt from it (it's on PATH and is Qt's
    # built-in fallback) and a package with missing pieces still passes.
    # --list-playing starts the app, runs the OS's media detector once and exits.
    - name: Hide the Qt install
      shell: bash
      run: mv "$QT_ROOT_DIR" "$QT_ROOT_DIR-hidden"

    - name: Smoke test (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir smoke && tar -xzf AutomaticPassiveImmersion-${{ matrix.name }}.tar.gz -C smoke
        xvfb-run -a ./smoke/bin/AutomaticPassiveImmersion --list-playing

    - name: Smoke test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      timeout-minutes: 2
      run: |
        Expand-Archive AutomaticPassiveImmersion-${{ matrix.name }}.zip -DestinationPath smoke
        foreach ($file in "vcruntime140.dll", "Qt6Core.dll", "qt.conf") {
          if (-not (Test-Path "smoke/$file")) { Write-Error "$file isn't next to the exe in the zip"; exit 1 }
        }
        $app = Start-Process -FilePath smoke/AutomaticPassiveImmersion.exe -ArgumentList "--list-playing" -Wait -PassThru -NoNewWindow
        if ($app.ExitCode -ne 0) { Write-Error "App exited with $($app.ExitCode)"; exit 1 }

    - name: Smoke test (macOS)
      if: runner.os == 'macOS'
      run: |
        ditto -x -k AutomaticPassiveImmersion-${{ matrix.name }}.zip smoke
        ./smoke/AutomaticPassiveImmersion.app/Contents/MacOS/AutomaticPassiveImmersion --list-playing

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AutomaticPassiveImmersion-${{ matrix.name }}
        path: AutomaticPassiveImmersion-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download the archives
      uses: actions/download-artifact@v4
      with:
        path: archives
        merge-multiple: true

    # The asset names must stay the same: the app's update check looks for them
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd archives
        {
          cat ../release-notes.md
          echo
          echo "## SHA-256"
          echo '```'
          sha256sum AutomaticPassiveImmersion-*
          echo '```'
        } > ../notes.md
        gh release create "$GITHUB_REF_NAME" AutomaticPassiveImmersion-* \
          --title "$GITHUB_REF_NAME" --notes-file ../notes.md --verify-tag
